<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BranRoom ルールブック</title>
<meta name="theme-color" content="#2b2118">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BranRoom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f4ef; --paper:#fffdf9; --text:#2b2521; --muted:#7c736b;
  --line:#e6ded2; --accent:#7a5636; --accent-soft:#efe5d8;
  --side:#2b2118; --side-text:#f3eade; --side-muted:#b9a894;
  --radius:14px; --maxw:900px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:calc(16px * var(--fs,1)); line-height:1.9;
  -webkit-text-size-adjust:100%;
}
button,input{font:inherit}
a{color:var(--accent)}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,#3a2c20 0%,#241b14 60%,#1b140f 100%);}
.lockcard{width:100%;max-width:380px;background:var(--paper);border-radius:20px;padding:28px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
.locklogo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--side);color:#f6ead9;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.5px;font-size:22px}
.lockcard h1{font-size:18px;margin:0 0 4px}
.lockcard p{font-size:13px;color:var(--muted);margin:0 0 18px}
#pw{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:16px}
#pw:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#unlockBtn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;letter-spacing:.02em}
#unlockBtn:disabled{opacity:.6}
#lockMsg{min-height:20px;margin-top:10px;font-size:13px;color:#b3261e}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted)}

/* ---------- app ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(247,244,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em}
.tools{display:flex;gap:8px;align-items:center}
.tool{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--text)}
.tool:active{background:var(--accent-soft)}

#searchWrap{padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:15}
#search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#results{display:none;max-height:50vh;overflow:auto;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
#results.on{display:block}
.res{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.6}
.res:last-child{border-bottom:0}
.res b{font-size:11px;color:var(--accent);display:block;margin-bottom:2px}
.res small{color:var(--muted)}

.layout{display:flex;align-items:flex-start}
nav{position:sticky;top:0;align-self:stretch;width:260px;flex:0 0 260px;min-height:100vh;background:var(--side);color:var(--side-text);padding:18px 12px 40px}
nav .navtitle{font-size:11px;letter-spacing:.14em;color:var(--side-muted);padding:0 10px 10px}
nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--side-text);padding:11px 12px;border-radius:10px;font-size:14px;line-height:1.5}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(255,255,255,.12);font-weight:600}
nav .note{margin:18px 10px 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:var(--side-muted);line-height:1.7}

main{flex:1;min-width:0;padding:22px 16px 80px}
article{max-width:var(--maxw);margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px 40px;box-shadow:0 2px 14px rgba(60,45,30,.05)}
article h1{font-size:1.55em;line-height:1.4;margin:.2em 0 .6em;padding-bottom:.5em;border-bottom:2px solid var(--accent-soft)}
article h2{font-size:1.22em;margin:1.9em 0 .6em;padding-left:.55em;border-left:5px solid var(--accent);line-height:1.5}
article h3{font-size:1.05em;margin:1.5em 0 .4em;color:#4a3a2c}
article p{margin:.7em 0}
article ul,article ol{padding-left:1.35em;margin:.6em 0}
article li{margin:.25em 0}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
article table{width:100%;border-collapse:collapse;margin:1em 0;font-size:.92em;display:block;overflow-x:auto}
article th,article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
article th{background:var(--accent-soft);white-space:nowrap}
article code{background:#f1ece4;padding:.1em .35em;border-radius:5px;font-size:.9em}
article pre{background:#2b2118;color:#f3eade;padding:14px;border-radius:12px;overflow:auto}
article pre code{background:transparent;color:inherit;padding:0}
article blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--accent);background:#faf6f0;color:#5c5046}
article strong{font-weight:700}
mark{background:#ffe9a8;color:inherit;padding:0 .1em;border-radius:3px}
.toc{margin:0 0 1.6em;padding:12px 16px;background:#faf6f0;border:1px solid var(--line);border-radius:12px;font-size:.9em}
.toc b{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.toc a{display:block;padding:2px 0;text-decoration:none}
.toc a:hover{text-decoration:underline}
.updated{max-width:var(--maxw);margin:14px auto 0;font-size:11px;color:var(--muted);text-align:right}
footer{max-width:var(--maxw);margin:26px auto 0;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}

#backdrop{display:none;position:fixed;inset:0;background:rgba(20,14,10,.5);z-index:25}
@media (max-width:860px){
  #menuBtn{display:block}
  nav{position:fixed;top:0;left:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;overflow:auto;min-height:0}
  nav.open{transform:none}
  #backdrop.on{display:block}
  #searchWrap{top:57px}
  article{padding:20px 16px 34px;border-radius:12px}
  main{padding:16px 12px 90px}
}
@media print{
  header,#searchWrap,nav,#lock,#backdrop,footer,.updated{display:none!important}
  body{background:#fff;font-size:11pt}
  article{border:0;box-shadow:none;max-width:none;padding:0}
  #app{display:block!important}
}
</style>
</head>
<body>

<div id="lock">
  <form class="lockcard" id="lockForm" autocomplete="off">
    <div class="locklogo">BR</div>
    <h1>BranRoom ルールブック</h1>
    <p>合言葉を入力してください</p>
    <input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" placeholder="合言葉">
    <button id="unlockBtn" type="submit">開く</button>
    <div id="lockMsg"></div>
    <label class="remember"><input type="checkbox" id="remember" checked> この端末では次回から自動で開く</label>
  </form>
</div>

<div id="app">
  <header>
    <button id="menuBtn" aria-label="メニュー">☰</button>
    <div class="brand">BranRoom ルールブック<small>天王寺店 / 社内用</small></div>
    <div class="tools">
      <button class="tool" id="fsBtn" title="文字サイズ">Aa</button>
      <button class="tool" id="printBtn" title="印刷・PDF">印刷</button>
    </div>
  </header>

  <div id="searchWrap">
    <input id="search" type="search" placeholder="資料を検索（例: キャンセル、糠、退会）" autocomplete="off">
    <div id="results"></div>
  </div>

  <div class="layout">
    <nav id="nav">
      <div class="navtitle">もくじ</div>
      <div id="navList"></div>
      <div class="note">この画面は社内用です。合言葉とURLを外部に共有しないでください。</div>
    </nav>
    <main>
      <article id="doc"></article>
      <div class="updated" id="updated"></div>
      <footer>BranRoom天王寺 店舗ルールブック<br>内容は暫定です。変更点は本部確認のうえ更新してください。</footer>
    </main>
  </div>
</div>
<div id="backdrop"></div>

function b64d(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

let DOCS = null, current = 0, lastQuery = "";
let fs = parseFloat(localStorage.getItem("br_fs") || "1");
document.documentElement.style.setProperty("--fs", fs);

async function derive(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:SALT, iterations:ITER, hash:"SHA-256"}, base, 512);
  const b = new Uint8Array(bits);
  return { aes: b.slice(0,32), mac: b.slice(32,64) };
}

async function unlock(pw){
  const {aes, mac} = await derive(pw);
  const mk = await crypto.subtle.importKey("raw", mac, {name:"HMAC", hash:"SHA-256"}, false, ["verify"]);
  const data = new Uint8Array(IV.length + CT.length); data.set(IV,0); data.set(CT,IV.length);
  const ok = await crypto.subtle.verify("HMAC", mk, MAC, data);
  if(!ok) throw new Error("bad password");
  const key = await crypto.subtle.importKey("raw", aes, {name:"AES-CBC"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:IV}, key, CT);
  return JSON.parse(new TextDecoder().decode(pt));
}

function openApp(docs, built){
  DOCS = docs;
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  docs.forEach((d,i)=>{
    const b=document.createElement("button");
    b.textContent=d.title; b.onclick=()=>{show(i); nav.classList.remove("open"); backdrop.classList.remove("on");};
    b.dataset.i=i; nav.appendChild(b);
  });
  document.getElementById("updated").textContent = "更新日: " + (built || BUILT);
  show(0);
}

function show(i){
  current=i;
  document.querySelectorAll("#navList button").forEach(b=>b.classList.toggle("on", +b.dataset.i===i));
  const d=DOCS[i];
  const el=document.getElementById("doc");
  el.innerHTML = marked.parse(d.body, {gfm:true});
  addTOC(el);
  if(lastQuery) highlight(el, lastQuery);
  window.scrollTo({top:0,behavior:"instant"});
  document.title = d.title + " | BranRoom ルールブック";
}

function addTOC(el){
  const hs=[...el.querySelectorAll("h2")];
  if(hs.length<2) return;
  hs.forEach((h,i)=>{h.id="s"+i;});
  const box=document.createElement("div"); box.className="toc";
  box.innerHTML="<b>このページの目次</b>"+hs.map((h,i)=>`<a href="#s${i}">${escapeHtml(h.textContent)}</a>`).join("");
  const h1=el.querySelector("h1");
  if(h1) h1.insertAdjacentElement("afterend", box); else el.prepend(box);
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function highlight(root,q){
  if(!q || q.length<2) return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[]; let n;
  while((n=walker.nextNode())) if(re.test(n.nodeValue)) nodes.push(n);
  nodes.forEach(node=>{
    const span=document.createElement("span");
    span.innerHTML=escapeHtml(node.nodeValue).replace(re,m=>`<mark>${m}</mark>`);
    node.parentNode.replaceChild(span,node);
  });
}

function runSearch(q){
  const box=document.getElementById("results");
  q=q.trim();
  if(q.length<2){box.classList.remove("on");box.innerHTML="";return;}
  const out=[];
  DOCS.forEach((d,di)=>{
    d.body.split(/\n/).forEach(line=>{
      if(line.toLowerCase().includes(q.toLowerCase()) && out.length<40){
        out.push({di,title:d.title,line:line.replace(/^[#>\-\*\s]+/,"").slice(0,120)});
      }
    });
  });
  box.innerHTML = out.length? out.map(r=>`<div class="res" data-d="${r.di}"><b>${escapeHtml(r.title)}</b>${escapeHtml(r.line)}</div>`).join("")
    : `<div class="res"><small>「${escapeHtml(q)}」は見つかりませんでした</small></div>`;
  box.classList.add("on");
  box.querySelectorAll(".res[data-d]").forEach(el=>{
    el.onclick=()=>{
      lastQuery=q;
      show(+el.dataset.d);
      box.classList.remove("on");
      document.getElementById("search").blur();
    };
  });
}

const nav=document.getElementById("nav"), backdrop=document.getElementById("backdrop");
document.getElementById("menuBtn").onclick=()=>{nav.classList.add("open");backdrop.classList.add("on");};
backdrop.onclick=()=>{nav.classList.remove("open");backdrop.classList.remove("on");};
document.getElementById("search").addEventListener("input",e=>runSearch(e.target.value));
document.getElementById("fsBtn").onclick=()=>{
  fs = fs>=1.3?0.9:+(fs+0.1).toFixed(1);
  document.documentElement.style.setProperty("--fs", fs);
  localStorage.setItem("br_fs", fs);
};
document.getElementById("printBtn").onclick=()=>window.print();

document.getElementById("lockForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=document.getElementById("unlockBtn"), msg=document.getElementById("lockMsg");
  const pw=document.getElementById("pw").value;
  if(!pw) return;
  btn.disabled=true; msg.textContent="確認中…";
  try{
    const data=await unlock(pw);
    if(document.getElementById("remember").checked) localStorage.setItem("br_pw", pw);
    sessionStorage.setItem("br_unlocked","1");
    msg.textContent="";
    openApp(data.docs, data.built);
  }catch(err){
    msg.textContent="合言葉が違います。";
    btn.disabled=false;
  }
});

(async function boot(){
  const saved=localStorage.getItem("br_pw");
  if(saved){
    try{ const data=await unlock(saved); openApp(data.docs, data.built); return; }catch(e){ localStorage.removeItem("br_pw"); }
  }
  document.getElementById("pw").focus();
})();

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
